# Default values for universal-canary chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# 'rl' for Reinforcement Learning Agent, 'rule-based' for static threshold analysis
evaluationMode: "rl"

serviceName: example-service
replicas: 1
image: nginx:latest
containerPort: 80
portName: http
serviceType: ClusterIP
envNamespace: ""

# nodePort is only used if serviceType is NodePort
# nodePort: 30080

# Istio sidecar injection is controlled via the namespace label (istio-injection: enabled).
# No pod annotation needed.
podAnnotations: {}

readinessProbe: {}
#  httpGet:
#    path: /
#    port: 80
#  initialDelaySeconds: 5

env: []
#  - name: EXAMPLE_ENV
#    value: "example"

# Set to true only for loadgenerator (deploys as Deployment, not Rollout)
isLoadGenerator: false

extraVolumes: []
extraVolumeMounts: []
