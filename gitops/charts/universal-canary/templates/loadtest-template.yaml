{{- if and (eq .Values.envNamespace "twin") (not .Values.isLoadGenerator) }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Values.serviceName }}-loadtest
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  metrics:
  - name: stress-test
    # Job provider in Argo Rollouts runs the Job and waits for completion
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              containers:
              - name: load-tester
                image: williamyeh/hey
                # Run load test directly using /hey binary in the container
                command: ["/hey", "-z", "2m", "-c", "50", "http://frontend.{{ .Values.envNamespace }}.svc.cluster.local:8080/"]
              restartPolicy: Never
{{- end }}
