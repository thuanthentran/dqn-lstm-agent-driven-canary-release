serviceName: emailservice
replicas: 1
image: ghcr.io/thuanthentran/emailservice:latest
containerPort: 8080
portName: grpc
env:
  - name: PORT
    value: "8080"
  - name: DISABLE_PROFILER
    value: "1"
readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:8080"]
