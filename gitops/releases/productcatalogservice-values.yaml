serviceName: productcatalogservice
replicas: 1
image: ghcr.io/thuanthentran/productcatalogservice:latest
containerPort: 3550
portName: grpc
env:
  - name: PORT
    value: "3550"
  - name: DISABLE_PROFILER
    value: "1"
readinessProbe:
  initialDelaySeconds: 20
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:3550"]
