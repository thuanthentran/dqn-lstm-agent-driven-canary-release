serviceName: shoppingassistantservice
replicas: 1
image: ghcr.io/thuanthentran/shoppingassistantservice:latest
containerPort: 8080
portName: grpc
env:
  - name: PORT
    value: "8080"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice:3550"
  - name: DISABLE_PROFILER
    value: "1"
readinessProbe:
  initialDelaySeconds: 15
  grpc:
    port: 8080
