serviceName: currencyservice
replicas: 1
image: ghcr.io/thuanthentran/currencyservice:latest
containerPort: 7000
portName: grpc
env:
  - name: PORT
    value: "7000"
  - name: DISABLE_PROFILER
    value: "1"
readinessProbe:
  initialDelaySeconds: 20
  exec:
    command: ["/bin/grpc_health_probe", "-addr=:7000"]
