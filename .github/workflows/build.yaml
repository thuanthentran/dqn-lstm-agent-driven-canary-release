name: Build and Push Microservices

on:
  push:
    branches: ["istio"]
    paths:
      - 'services/src/adservice/**'
      - 'services/src/cartservice/**'
      - 'services/src/checkoutservice/**'
      - 'services/src/currencyservice/**'
      - 'services/src/emailservice/**'
      - 'services/src/frontend/**'
      - 'services/src/loadgenerator/**'
      - 'services/src/paymentservice/**'
      - 'services/src/productcatalogservice/**'
      - 'services/src/recommendationservice/**'
      - 'services/src/shippingservice/**'
      - 'services/src/shoppingassistantservice/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (leave empty to auto-detect)'
        required: false
        type: choice
        options:
          - ''
          - all
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice


permissions:
  contents: write   # needed to commit values file updates
  packages: write   # needed to push to GHCR

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Detect which services changed
  # ─────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            adservice:
              - 'services/src/adservice/**'
            cartservice:
              - 'services/src/cartservice/**'
            checkoutservice:
              - 'services/src/checkoutservice/**'
            currencyservice:
              - 'services/src/currencyservice/**'
            emailservice:
              - 'services/src/emailservice/**'
            frontend:
              - 'services/src/frontend/**'
            loadgenerator:
              - 'services/src/loadgenerator/**'
            paymentservice:
              - 'services/src/paymentservice/**'
            productcatalogservice:
              - 'services/src/productcatalogservice/**'
            recommendationservice:
              - 'services/src/recommendationservice/**'
            shippingservice:
              - 'services/src/shippingservice/**'


      - name: Build matrix from changed services
        id: set-matrix
        run: |
          # If manual dispatch with specific service, use that
          if [[ "${{ github.event.inputs.service }}" == "all" ]]; then
            echo 'matrix=["adservice", "cartservice", "checkoutservice", "currencyservice", "emailservice", "frontend", "loadgenerator", "paymentservice", "productcatalogservice", "recommendationservice", "shippingservice"]' >> $GITHUB_OUTPUT
            exit 0
          elif [[ -n "${{ github.event.inputs.service }}" ]]; then
            echo "matrix=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Otherwise, build matrix from detected changes
          CHANGES='${{ steps.filter.outputs.changes }}'
          echo "matrix=${CHANGES}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build & push each changed service image
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}"
          echo "image=${IMAGE,,}" >> $GITHUB_OUTPUT

      # cartservice keeps its Dockerfile one level deeper (src/Dockerfile).
      # All other services have it at the context root.
      - name: Resolve Dockerfile path
        id: dockerfile
        run: |
          NESTED="./services/src/${{ matrix.service }}/src/Dockerfile"
          DEFAULT="./services/src/${{ matrix.service }}/Dockerfile"
          if [[ -f "${NESTED}" ]]; then
            echo "path=${NESTED}" >> $GITHUB_OUTPUT
          else
            echo "path=${DEFAULT}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/src/${{ matrix.service }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Update GitOps values with new image SHA
        run: |
          VALUES_FILE="gitops/releases/${{ matrix.service }}-values.yaml"
          if [[ -f "${VALUES_FILE}" ]]; then
            sed -i "s|^image:.*|image: ${{ steps.meta.outputs.image }}:${{ github.sha }}|" "${VALUES_FILE}"
            echo "Updated ${VALUES_FILE}"
          else
            echo "WARNING: ${VALUES_FILE} not found, skipping update"
          fi

      # Multiple matrix jobs run in parallel and all push to the same branch.
      # A retry loop with pull --rebase handles the resulting race condition.
      - name: Commit and push GitOps values update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/releases/${{ matrix.service }}-values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit for ${{ matrix.service }}"
            exit 0
          fi
          git commit -m "ci(gitops): update ${{ matrix.service }} image -> ${{ github.sha }}"

          # Retry up to 5 times in case another parallel job pushed first
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5 for ${{ matrix.service }}..."
            if git push origin ${{ github.ref_name }}; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected — pulling remote changes and rebasing..."
            git pull --rebase origin ${{ github.ref_name }}
          done
          echo "ERROR: failed to push after 5 attempts"
          exit 1