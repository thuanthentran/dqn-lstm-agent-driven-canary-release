name: S3_memory_leak
duration_minutes: 15
target_rollout: "checkoutservice"
namespace: "msdemo"
steps:
  - t_offset_seconds: 0
    chaos: 
      CHAOS_ENABLED: "true"
      CHAOS_MEM_ALLOC_MB: "0"
  - t_offset_seconds: 180
    chaos: 
      CHAOS_MEM_ALLOC_MB: "50"
  - t_offset_seconds: 360
    chaos: 
      CHAOS_MEM_ALLOC_MB: "100"
  - t_offset_seconds: 540
    chaos: 
      CHAOS_MEM_ALLOC_MB: "200"
